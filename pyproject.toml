[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "castle-steward-engine"
version = "0.1.0"
description = "Durable workflow engine driven through the Agent Layer CLI."
readme = "README.md"
requires-python = "==3.15.2"
dependencies = [
    "alembic>=1.16",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=2",
    "mcp>=2.3,<3",  # stdio server and client APIs from MCP SDK 2.x
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.1",
    "sqlmodel>=0.0.50",
]

[project.scripts]
stew = "castle_steward_engine.cli:main"

[project.entry-points."castle_steward_engine.workflows"]
coding = "castle_steward_coding:WORKFLOW"

[dependency-groups]
# Pin dev tools so local checks and CI use the same versions.
dev = [
    "ruff==0.17.0",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
]

[tool.setuptools.packages.find]
include = ["castle_steward_engine*", "castle_steward_coding*"]

[tool.alembic]
script_location = "%(here)s/castle_steward_engine/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "A", "C90", "RUF", "PIE"]

[tool.ruff.lint.mccabe]
max-complexity = 11

[tool.ruff.lint.per-file-ignores]
# Prose for agents: long lines inside prompt templates are deliberate.
"castle_steward_coding/prompt_templates.py" = ["E501"]
# End-to-end workflow tests use multi-turn FakeAgentLayer dispatch closures.
"tests/*" = ["C901"]

[tool.ruff.lint.isort]
known-first-party = ["castle_steward_engine", "castle_steward_coding", "tests"]

[tool.mypy]
files = ["castle_steward_engine", "castle_steward_coding", "tests"]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
