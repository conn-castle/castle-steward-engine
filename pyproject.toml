[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "castle-steward-engine"
version = "0.1.0"
description = "Durable coding-job graph driven through the Agent Layer CLI."
readme = "README.md"
# The one supported interpreter, and its only declaration: `make install` (uv venv) selects
# it, ruff derives its target from it, mypy checks for the .venv interpreter it runs on.
requires-python = "==3.15.2"
dependencies = [
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=2",
    "mcp>=2.3,<3",  # stdio server and client APIs from MCP SDK 2.x
    "pydantic>=2.7",
    "typing-extensions>=4.12",
]

[project.scripts]
castle-steward = "castle_steward_engine.cli:main"

[dependency-groups]
# Pin Ruff, mypy, and pre-commit so local hooks and CI use the same versions.
dev = [
    "ruff==0.15.11",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["castle_steward_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prose for agents: long lines inside the prompt strings are deliberate.
"castle_steward_engine/workflows/coding/config.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["castle_steward_engine", "tests"]

[tool.mypy]
files = ["castle_steward_engine"]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
