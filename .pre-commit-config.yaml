# Tool versions come from pyproject's dev dependency group.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
  - repo: local
    hooks:
      - id: ruff-fix
        name: ruff check --fix
        entry: .venv/bin/ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types_or: [python, pyi]
      - id: check-python
        name: mypy and pytest when Python code is present
        entry: make check-python
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
