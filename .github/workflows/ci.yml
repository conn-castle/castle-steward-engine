name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Latest uv, so it can download the pinned CPython (older uv may not list it).
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - run: make install
      - run: make check
      - run: .venv/bin/pre-commit run --all-files --show-diff-on-failure
